<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Coming Soon</title>
  <meta name="description" content="This domain is parked for now. Something may be coming soon." />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #0d0d0f;
      color: #f5f5f5;
    }

    .card {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 7px 12px;
      border: 1px solid #2c2c32;
      border-radius: 999px;
      color: #a8a8b3;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #151518;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(42px, 9vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 700;
    }

    p {
      max-width: 480px;
      margin: 0 auto;
      color: #92929d;
      font-size: 17px;
      line-height: 1.6;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: #75e6a4;
      box-shadow: 0 0 16px rgba(117, 230, 164, 0.5);
      vertical-align: 1px;
    }

    footer {
      position: fixed;
      bottom: 22px;
      left: 0;
      width: 100%;
      padding: 0 24px;
      text-align: center;
      color: #55555f;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      Domain secured
    </div>

    <h1>Parked for now.</h1>

    <p>
      This domain has a new home, but there’s nothing to see here just yet.
      Check back sometime.
    </p>
  </main>

  <footer>
    &copy; <span id="year"></span>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
